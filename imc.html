
<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>CALCULADORA IMC</title>
</head>

<body class="h-100 m-0 p-0">

    <div class="container-fluid min-vh-100 p-4 card border-0 rounded-0 d-flex justify-content-center"
         style="background-color: #287271; color: white;">

        <h1 class="text-center">CALCULADORA DE ÍNDICE CORPORAL</h1>
        <hr style="border-color: white;">

        <div class="row align-items-center">

            <div class="col-6">

                <h5>PESO (kg): <span id="vp">20</span></h5>
                <input type="range" class="form-control" id="peso"
                       min="20" max="200" value="20">
                <br>

                <h5>ESTATURA (cm): <span id="ve">100</span></h5>
                <input type="range" class="form-control" id="estatura"
                       min="100" max="220" value="100">

                <h2 class="text-center mt-5 mb-4">
                    RESULTADO: <span id="imc">0</span>
                </h2>

                <button id="reset" class="btn btn-info form-control">
                    REINICIAR
                </button>

            </div>

            <div class="col-6">

                <table class="table table-bordered text-center text-white"
                       style="background-color: transparent; margin: 0;">

                    <thead>
                        <tr>
                            <th style="background-color: #b2dfdb; color: black;">
                                Categoría
                            </th>
                            <th style="background-color: #b2dfdb; color: black;">
                                Valor IMC
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td style="background-color: #64b5f6; font-weight: bold;">
                                BAJO PESO
                            </td>
                            <td style="background-color: #64b5f6; font-weight: bold;">
                                Menor a 18.5
                            </td>
                        </tr>

                        <tr>
                            <td style="background-color: #81c784; font-weight: bold;">
                                NORMAL
                            </td>
                            <td style="background-color: #81c784; font-weight: bold;">
                                18.5 a 24.9
                            </td>
                        </tr>

                        <tr>
                            <td style="background-color: #ffd54f; font-weight: bold;">
                                SOBREPESO
                            </td>
                            <td style="background-color: #ffd54f; font-weight: bold;">
                                25 a 29.9
                            </td>
                        </tr>

                        <tr>
                            <td style="background-color: #ffb74d; font-weight: bold;">
                                OBESIDAD I
                            </td>
                            <td style="background-color: #ffb74d; font-weight: bold;">
                                30 a 34.9
                            </td>
                        </tr>

                        <tr>
                            <td style="background-color: #e57373; font-weight: bold;">
                                OBESIDAD II
                            </td>
                            <td style="background-color: #e57373; font-weight: bold;">
                                35 a 39.9
                            </td>
                        </tr>

                        <tr>
                            <td style="background-color: #c62828; font-weight: bold;">
                                OBESIDAD III
                            </td>
                            <td style="background-color: #c62828; font-weight: bold;">
                                40 o más
                            </td>
                        </tr>
                    </tbody>

                </table>
                

            </div>
            
            
        </div>
        
        
    </div>
<a href="index.html" class="btn btn-light form-control">
    <i class="bi bi-arrow-left-circle"></i> REGRESAR AL MENÚ
</a>


    

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/imc.js"></script>
    

</body>
</html>
