
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>

    <nav class="navbar bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="index.html">
                <i class="bi bi-shop-window"></i>
                MINI MARKET
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-light mt-5 card shadow">
        <h1 class="text-center text-primary">
            <i class="bi bi-basket2-fill"></i> MI TIENDITA
        </h1>
        <hr>

        <button class="btn btn-primary w-25"
        onclick="document.getElementById('addProducto').showModal()">
            <i class="bi bi-plus-circle"></i> Agregar
        </button>

        <table class="table table-striped table-hover mt-3 w-100">
            <thead class="table-dark">
                <tr class="text-center">
                    <th>PRODUCTO</th>
                    <th>PRECIO</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="productos">
            </tbody>
        </table>
    </div>


    <dialog class="p-0 border-0 rounded shadow" id="addProducto">
        <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="bi bi-box-seam"></i> AGREGAR PRODUCTO
            </h4>
            <button type="button" class="btn-close btn-close-white"
            onclick="document.getElementById('addProducto').close()">
            </button>
        </div>

        <div class="p-4">
            <h5>NOMBRE</h5>
            <input type="text" id="nombre" class="form-control" placeholder="Nombre del producto"><br>

            <h5>PRECIO</h5>
            <input type="number" id="precio" class="form-control" placeholder="Precio"><br>
        </div>

        <div class="bg-light p-3 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-danger"
            onclick="document.getElementById('addProducto').close()">
                <i class="bi bi-x-circle"></i> Cancelar
            </button>

            <button type="button" class="btn btn-success" id="btnSave">
                <i class="bi bi-cloud-arrow-up"></i> Guardar
            </button>
        </div>
    </dialog>


    <dialog class="p-0 border-0 rounded shadow" id="editarProducto">
        <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="bi bi-pencil-square"></i> EDITAR PRODUCTO
            </h4>
            <button type="button" class="btn-close btn-close-white"
            onclick="document.getElementById('editarProducto').close()">
            </button>
        </div>

        <div class="p-4">
            <h5>NOMBRE</h5>
            <input type="text" id="nombree" class="form-control"><br>

            <h5>PRECIO</h5>
            <input type="number" id="precioe" class="form-control"><br>
        </div>

        <div class="bg-light p-3 d-flex justify-content-end gap-2">
            <input type="hidden" name="posicion" id="posicion">

            <button type="button" class="btn btn-danger"
            onclick="document.getElementById('editarProducto').close()">
                <i class="bi bi-x-circle"></i> Cancelar
            </button>

            <button type="button" class="btn btn-success" id="btnUpdate">
                <i class="bi bi-arrow-repeat"></i> Actualizar
            </button>
        </div>
    </dialog>


    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/tiendita.js"></script>

</body>
</html>
